<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Procedures</title>

    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<!-- PAGE HEADER -->
<div class="container py-4">

    <div class="mb-4">
        <h2 class="fw-bold">Procedures</h2>
        <p class="text-muted">Manage system procedures efficiently</p>
    </div>

    <!-- ADD PROCEDURE -->
    <div class="card shadow-sm p-4 mb-4">

        <h5 class="mb-3">Add New Procedure</h5>

        <div class="row g-3">

            <div class="col-md-4">
                <label class="form-label">Procedure Name</label>
                <input type="text" id="procedureName" class="form-control" placeholder="Enter procedure">
            </div>

            <div class="col-md-3">
                <label class="form-label">Department</label>
                <select id="department" class="form-select">
                    <option value="">Select Department</option>
                    <option>Driver</option>
                    <option>Painting</option>
                    <option>Finishing</option>
                    <option>Carpentry</option>
                    <option>Safety</option>
                </select>
            </div>

           <div class="col-md-2">
    <label class="form-label">Order No</label>
    <input type="number"
           id="orderNo"
           class="form-control"
           placeholder="Enter Order No">
</div>

<div class="col-md-2">
    <label class="form-label">Status</label>
    <select id="procedureStatus" class="form-select">

        <option value="Active" selected>
            Active
        </option>

        <option value="Inactive">
            Inactive
        </option>

    </select>
</div>

<div class="col-md-1 d-grid">
    <label class="form-label">&nbsp;</label>
    <button class="btn btn-primary"
            id="saveProcedure">
        Save
    </button>
</div>

        </div>

    </div>

    <!-- SEARCH -->
    <div class="row mb-3">
        <div class="col-md-4">
            <input type="text" id="search" class="form-control" placeholder="Search Procedure">
        </div>
    </div>

    <!-- TABLE -->
    <div class="card shadow-sm">

        <div class="card-header bg-dark text-white">
            <strong>Procedure List</strong>
        </div>

        <div class="table-responsive">

            <table class="table table-hover table-bordered mb-0">

                <thead class="table-light">
                    <tr>
                       <th>Procedure Name</th>
<th>Department</th>
<th>Order No</th>
<th>Status</th>
<th>Action</th>
                    </tr>
                </thead>

                <tbody id="procedureTable">

                   <tr>
    <td>Primer Application</td>
    <td>Painting</td>
    <td>1</td>
    <td>
        <span class="badge bg-success">
            Active
        </span>
    </td>
    <td>
        <button class="btn btn-warning btn-sm">
            Edit
        </button>

        <button class="btn btn-danger btn-sm">
            Delete
        </button>
    </td>
</tr>
                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
