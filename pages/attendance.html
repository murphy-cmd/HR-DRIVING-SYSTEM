<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- CLEAN PAGE -->
<div class="container-fluid p-4">

<!-- TITLE ONLY (NO BANNER, NO LOGO, NO EXTRA TEXT) -->
<h3 class="fw-bold mb-4">Attendance</h3>

<!-- MAIN TABLE -->
<div class="card shadow-sm border-0">

<div class="card-body">

<div class="table-responsive">

<table class="table table-hover align-middle">

<thead class="table-light">
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Type</th>
    <th>AM IN</th>
    <th>Late</th>
    <th>Status</th>
    <th>BREAK</th>
    <th>PM IN</th>
    <th>TIME OUT</th>
    <th>Work Hours</th>
    <th>OT Hours</th>
    <th>START TRIP</th>
    <th>END TRIP</th>
</tr>
</thead>

<tbody id="attendanceTable"></tbody>

</table>

</div>

</div>
</div>

<!-- TODAY ACTIVITY (CLEAN) -->
<div class="mt-4">

<h6 class="fw-bold mb-3">Today's Activity</h6>

<div class="card shadow-sm">

<div class="card-body">

<div class="table-responsive">

<table class="table table-sm">

<thead class="table-light">
<tr>
    <th>Time</th>
    <th>Employee</th>
    <th>Action</th>
</tr>
</thead>

<tbody id="todayHistory"></tbody>

</table>

</div>

</div>

</div>

</div>

<!-- SUMMARY (CLEAN GRID) -->
<div id="attendanceSummary" class="mt-4" style="display:none;">

<div class="row g-3">

<div class="col-md-3">
<div class="card p-3 text-center">
<h6>Present</h6>
<h3 id="presentCount">0</h3>
</div>
</div>

<div class="col-md-3">
<div class="card p-3 text-center">
<h6>Late</h6>
<h3 id="lateCount">0</h3>
</div>
</div>

<div class="col-md-3">
<div class="card p-3 text-center">
<h6>Absent</h6>
<h3 id="absentCount">0</h3>
</div>
</div>

<div class="col-md-3">
<div class="card p-3 text-center">
<h6>On Leave</h6>
<h3 id="leaveCount">0</h3>
</div>
</div>

</div>

</div>

</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/attendance.js"></script>

</body>
</html>
