<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container-fluid py-3">

<h3 class="fw-bold mb-4">
    Attendance Management
</h3>

<!-- ============================= -->
<!-- TABS -->
<!-- ============================= -->

<ul class="nav nav-tabs mb-4">

    <li class="nav-item">

        <button
            id="boardTab"
            class="nav-link active">

            Attendance Board

        </button>

    </li>

    <li class="nav-item">

        <button
            id="summaryTab"
            class="nav-link">

            Attendance Summary

        </button>

    </li>

</ul>

<!-- ============================= -->
<!-- ATTENDANCE BOARD -->
<!-- ============================= -->

<div id="attendanceBoard">

<div class="card shadow-sm">

<div class="card-body">

<div class="table-responsive">

<table class="table table-bordered table-hover align-middle">

<thead class="table-primary">

<tr>

<th>ID</th>

<th>Name</th>

<th>Type</th>

<th>AM IN</th>

<th>Late</th>

<th>Status</th>

<th>BREAK</th>

<th>PM IN</th>

<th>TIME OUT</th>

<th>Work Hours</th>

<th>OT Hours</th>

<th>START TRIP</th>

<th>END TRIP</th>

</tr>

</thead>

<tbody id="attendanceTable">

</tbody>

</table>

</div>

</div>

</div>

<!-- ============================= -->
<!-- TODAY ACTIVITY -->
<!-- ============================= -->

<div class="card shadow-sm mt-4">

<div class="card-header fw-bold">

Today's Activity

</div>

<div class="card-body">

<div class="table-responsive">

<table class="table table-striped">

<thead>

<tr>

<th>Time</th>

<th>Employee</th>

<th>Action</th>

</tr>

</thead>

<tbody id="todayHistory">

</tbody>

</table>

</div>

</div>

</div>

</div>

<!-- ============================= -->
<!-- ATTENDANCE SUMMARY -->
<!-- ============================= -->

<div
id="attendanceSummary"
style="display:none;">

<div class="row mb-4">

    <div class="col-md-3">

        <div class="card text-center shadow-sm">

            <div class="card-body">

                <h6>Present</h6>

                <h2 id="presentCount">0</h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center shadow-sm">

            <div class="card-body">

                <h6>Late</h6>

                <h2 id="lateCount">0</h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center shadow-sm">

            <div class="card-body">

                <h6>Absent</h6>

                <h2 id="absentCount">0</h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card text-center shadow-sm">

            <div class="card-body">

                <h6>On Leave</h6>

                <h2 id="leaveCount">0</h2>

            </div>

        </div>

    </div>

</div>

<!-- ============================= -->
<!-- FILTERS -->
<!-- ============================= -->

<div class="card shadow-sm mb-4">

<div class="card-body">

<div class="row">

<div class="col-md-4">

<input
type="text"
id="searchEmployee"
class="form-control"
placeholder="Search Employee">

</div>

<div class="col-md-3">

<input
type="date"
id="summaryDate"
class="form-control">

</div>

<div class="col-md-3">

<select
id="statusFilter"
class="form-select">

<option value="">All Status</option>

<option value="ON TIME">ON TIME</option>

<option value="LATE">LATE</option>

<option value="ABSENT">ABSENT</option>

<option value="ON LEAVE">ON LEAVE</option>

<option value="LEAVE REJECTED">LEAVE REJECTED</option>

</select>

</div>

<div class="col-md-2">

<button
id="searchBtn"
class="btn btn-primary w-100">

Search

</button>

</div>

</div>

</div>

</div>

<!-- ============================= -->
<!-- SUMMARY TABLE -->
<!-- ============================= -->

<div class="card shadow-sm">

<div class="card-body">

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead class="table-primary">

<tr>

<th>Date</th>

<th>ID</th>

<th>Name</th>

<th>Type</th>

<th>AM IN</th>

<th>BREAK</th>

<th>PM IN</th>

<th>TIME OUT</th>

<th>Late</th>

<th>Work Hours</th>

<th>OT Hours</th>

<th>Status</th>

</tr>

</thead>

<tbody id="summaryTable">

</tbody>

</table>

</div>

</div>

</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-config.js"></script>

<script src="js/attendance.js"></script>

</body>

</html>
