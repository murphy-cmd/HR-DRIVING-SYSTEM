<div class="page">

    <div class="page-header">

        <button id="addEmployeeBtn" class="primary-btn">
            <i class="fa-solid fa-plus"></i>
            Add Employee
        </button>

    </div>

    <div class="card">

        <div class="table-responsive">

            <table class="table">

                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Position</th>
                        <th>Employee Type</th>
                    </tr>
                </thead>

                <tbody id="employeeTable"></tbody>

            </table>

        </div>

    </div>

</div>

<!-- MODAL -->
<div id="employeeModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h3>Add Employee</h3>
            <button id="closeEmployeeModal">&times;</button>
        </div>

        <div class="modal-body">

            <input type="text" id="employeeId" placeholder="Employee ID">
            <input type="text" id="fullName" placeholder="Full Name">
            <input type="text" id="position" placeholder="Position">

          <select id="employeeType">
    <option value="Office Staff">Office Staff</option>
    <option value="Warehouse">Warehouse</option>
    <option value="Driver">Driver</option>
    <option value="Lead Man">Lead Man</option>
    <option value="Safety Officer">Safety Officer</option>

                
            </select>

        </div>

        <div class="modal-footer">

            <button id="cancelEmployee">Cancel</button>
            <button id="saveEmployee">Save</button>

        </div>

    </div>

</div>
