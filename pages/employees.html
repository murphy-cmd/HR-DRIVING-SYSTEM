<div class="modal-content">

    <div class="modal-header">

        <h4 class="modal-title fw-bold">
            <i class="fa-solid fa-user-plus me-2"></i>
            Add Employee
        </h4>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal">
        </button>

    </div>

    <div class="modal-body">

        <div class="row g-3">

            <div class="col-md-6">

                <label class="form-label fw-semibold">
                    Employee ID
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="employeeId"
                    placeholder="EMP 001">

            </div>

            <div class="col-md-6">

                <label class="form-label fw-semibold">
                    Full Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="fullName"
                    placeholder="Juan Dela Cruz">

            </div>

            <div class="col-md-6">

                <label class="form-label fw-semibold">
                    Position
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="position"
                    placeholder="Project Engineer">

            </div>

            <div class="col-md-6">

                <label class="form-label fw-semibold">
                    Employee Type
                </label>

                <select
                    class="form-select"
                    id="employeeType">

                    <option value="Office Staff">Office Staff</option>
                    <option value="Warehouse">Warehouse</option>
                    <option value="Driver">Driver</option>
                    <option value="Lead Man">Lead Man</option>
                    <option value="Safety Officer">Safety Officer</option>

                </select>

            </div>

        </div>

    </div>

    <div class="modal-footer">

        <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal">

            Cancel

        </button>

        <button
            type="button"
            class="btn btn-primary"
            id="saveEmployee">

            <i class="fa-solid fa-floppy-disk me-1"></i>
            Save Employee

        </button>

    </div>

</div>
