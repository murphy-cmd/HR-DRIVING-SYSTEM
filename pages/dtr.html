<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/dtr.css">
</head>

<body>

<div class="container-fluid py-4">

    <!-- HEADER (SAFE: removed logo + extra text only) -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <!-- title only (SAFE, no ID changes) -->
            <h4 class="fw-bold mb-3">DTR</h4>

            <!-- SEARCH PANEL (UNCHANGED IDS = SAFE JS) -->
            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Employee</label>
                    <input type="text" id="employeeSearch" class="form-control" placeholder="Search employee...">
                </div>

                <div class="col-md-3">
                    <label class="form-label">From Date</label>
                    <input type="date" id="fromDate" class="form-control">
                </div>

                <div class="col-md-3">
                    <label class="form-label">To Date</label>
                    <input type="date" id="toDate" class="form-control">
                </div>

                <div class="col-md-2 d-grid">
                    <label class="form-label invisible">.</label>
                    <button id="generateBtn" class="btn btn-primary">
                        <i class="fa-solid fa-magnifying-glass"></i> Generate
                    </button>
                </div>

            </div>

            <hr>

            <!-- ACTION BUTTONS (UNCHANGED IDs = SAFE) -->
            <div class="d-flex justify-content-end gap-2">

                <button id="excelBtn" class="btn btn-success">
                    <i class="fa-solid fa-file-excel"></i> Export Excel
                </button>

                <button id="pdfBtn" class="btn btn-danger">
                    <i class="fa-solid fa-file-pdf"></i> Export PDF
                </button>

            </div>

        </div>
    </div>

    <!-- TABLE (NO CHANGE STRUCTURE) -->
    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="table-responsive">

<table id="dtrTable" class="table table-bordered table-hover align-middle">
    
                    <thead class="table-dark">
                        <tr>
                            <th>Employee</th>
                            <th>Date</th>
                            <th>AM IN</th>
                            <th>BREAK</th>
                            <th>PM IN</th>
                            <th>TIME OUT</th>
                            <th>Work Hours</th>
                            <th>OT Hours</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="dtrBody"></tbody>

                </table>

            </div>

            <!-- SUMMARY (UNCHANGED IDS = SAFE JS) -->
            <div class="row mt-4">

                <div class="col-md-4">
                    <div class="alert alert-primary">
                        <strong>Total Records:</strong>
                        <span id="totalRecords">0</span>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="alert alert-success">
                        <strong>Total Work Hours:</strong>
                        <span id="totalWorkHours">0h 0m</span>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="alert alert-warning">
                        <strong>Total OT Hours:</strong>
                        <span id="totalOTHours">0h 0m</span>
                    </div>
                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
