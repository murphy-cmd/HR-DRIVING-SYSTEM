<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RILCO DTR System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/dtr.css">

</head>

<body>

<div class="container-fluid py-4">

    <!-- HEADER -->

    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body text-center">

            <img
                src="asset/rilco-logo.png"
                alt="RILCO Logo"
                class="company-logo mb-3">

            <h2 class="fw-bold text-primary mb-1">
                RILCO BUILDERS CONTRACTORS & ENGINEERS
            </h2>

            <h5 class="text-secondary mb-2">
                Daily Time Record (DTR)
            </h5>

            <small class="text-muted">
                Attendance Monitoring System
            </small>

        </div>

    </div>

    <!-- SEARCH PANEL -->

    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body">

            <div class="row g-3">
                                <!-- Employee -->

                <div class="col-md-4">

                    <label class="form-label fw-semibold">
                        Employee
                    </label>

                    <input
                        type="text"
                        id="employeeSearch"
                        class="form-control"
                        placeholder="Search employee...">

                </div>

                <!-- From Date -->

                <div class="col-md-3">

                    <label class="form-label fw-semibold">
                        From Date
                    </label>

                    <input
                        type="date"
                        id="fromDate"
                        class="form-control">

                </div>

                <!-- To Date -->

                <div class="col-md-3">

                    <label class="form-label fw-semibold">
                        To Date
                    </label>

                    <input
                        type="date"
                        id="toDate"
                        class="form-control">

                </div>

                <!-- Generate -->

                <div class="col-md-2 d-grid">

                    <label class="form-label text-white">
                        .
                    </label>

                    <button
                        id="generateBtn"
                        class="btn btn-primary">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        Generate

                    </button>

                </div>

            </div>

            <hr>

            <!-- ACTION BUTTONS -->

            <div class="d-flex flex-wrap gap-2 justify-content-end">

                <button
                    id="excelBtn"
                    class="btn btn-success">

                    <i class="fa-solid fa-file-excel"></i>

                    Export Excel

                </button>

                <button
                    id="pdfBtn"
                    class="btn btn-danger">

                    <i class="fa-solid fa-file-pdf"></i>

                    Export PDF

                </button>

            </div>

        </div>

    </div>

    <!-- DTR TABLE -->

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="table-responsive">

                <table
                    id="dtrTable"
                    class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>Employee</th>

                            <th>Date</th>

                            <th>AM IN</th>

                            <th>BREAK</th>

                            <th>PM IN</th>

                            <th>TIME OUT</th>

                            <th>Work Hours</th>

                            <th>OT Hours</th>

                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody id="dtrBody">

                    </tbody>

                </table>

            </div>
                        <!-- SUMMARY -->

            <div class="row mt-4">

                <div class="col-md-4">

                    <div class="alert alert-primary">

                        <strong>Total Records :</strong>

                        <span id="totalRecords">0</span>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="alert alert-success">

                        <strong>Total Work Hours :</strong>

                        <span id="totalWorkHours">0h 0m</span>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="alert alert-warning">

                        <strong>Total OT Hours :</strong>

                        <span id="totalOTHours">0h 0m</span>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-config.js"></script>

<!-- DTR Script -->

<script src="js/dtr.js"></script>

</body>

</html>
