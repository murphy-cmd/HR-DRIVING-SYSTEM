<div class="page settings-page">

    <div class="page-header">
        <div>
            <h1>Settings</h1>
            <p>Manage your account information and password.</p>
        </div>
    </div>

    <!-- Profile Information -->

    <div class="card">

        <h3>Profile Information</h3>

        <div class="form-grid">

            <div>
                <label>Employee ID</label>
                <input type="text" id="settingEmployeeId">
            </div>

            <div>
                <label>Full Name</label>
                <input type="text" id="settingFullName">
            </div>

            <div>
                <label>Email</label>
                <input type="email" id="settingEmail">
            </div>

            <div>
                <label>Position</label>
                <input type="text" id="settingPosition">
            </div>

            <div>
                <label>Department</label>
                <input type="text" id="settingDepartment">
            </div>

            <div>
                <label>Employee Type</label>
                <input type="text" id="settingEmployeeType">
            </div>

            <div>
                <label>Schedule In</label>
                <input type="time" id="settingScheduleIn">
            </div>

            <div>
                <label>Schedule Out</label>
                <input type="time" id="settingScheduleOut">
            </div>

            <div>
                <label>Grace Period (Minutes)</label>
                <input type="number" id="settingGracePeriod">
            </div>

        </div>

        <br>

        <button
            class="primary-btn"
            id="saveProfileBtn">

            Save Changes

        </button>

    </div>

    <br>

    <!-- Change Password -->

    <div class="card">

        <h3>Change Password</h3>

        <div class="form-grid">

            <div>
                <label>New Password</label>
                <input
                    type="password"
                    id="newPassword">
            </div>

            <div>
                <label>Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword">
            </div>

        </div>

        <br>

        <button
            class="primary-btn"
            id="changePasswordBtn">

            Update Password

        </button>

    </div>

</div>
