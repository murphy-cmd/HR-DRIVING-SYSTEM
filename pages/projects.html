<div class="page projects-page">

    <!-- =========================
        PAGE HEADER
    ========================== -->

    <div class="page-header d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">

                <i class="fa-solid fa-diagram-project"></i>

                Project Management

            </h2>

            <p class="text-muted">

                Manage all construction projects.

            </p>

        </div>

        <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#projectModal">

            <i class="fa-solid fa-plus"></i>

            New Project

        </button>

    </div>

    <!-- =========================
        SEARCH
    ========================== -->

    <div class="card mb-4">

        <div class="card-body">

            <input
                type="text"
                class="form-control"
                id="searchProject"
                placeholder="Search Project...">

        </div>

    </div>

    <!-- =========================
        ADD PROJECT MODAL
    ========================== -->

    <div class="modal fade" id="projectModal" tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">

                        Add / Edit Project

                    </h5>

                    <button class="btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Project Name</label>

                            <input type="text" class="form-control" id="projectName">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Client</label>

                            <input type="text" class="form-control" id="client">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Category</label>

                            <select class="form-select" id="category">

                                <option value="">Select Category</option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Location</label>

                            <input type="text" class="form-control" id="location">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Start Date</label>

                            <input type="date" class="form-control" id="startDate">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Expected Finish</label>

                            <input type="date" class="form-control" id="finishDate">

                        </div>

                    

   
                        <div class="col-md-12 mb-3">

                            <label class="form-label">Status</label>

                            <select class="form-select" id="status">

                                <option value="Active">Active</option>
                                <option value="On Hold">On Hold</option>
                                <option value="Completed">Completed</option>

                            </select>

                        </div>

                        <div class="col-md-12 mb-3">

    <label class="form-label">
        Assign Employees
    </label>

    <select
        class="form-select"
        id="projectEmployees"
        multiple
        style="height:200px;">
    </select>

    <small class="text-muted">
        Hold Ctrl to select multiple employees.
    </small>

</div>

                    </div>
                    

                </div>

                <div class="modal-footer">

                    <button class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button class="btn btn-primary" id="saveProject">
                        Save Project
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- =========================
        PROJECT LIST
    ========================== -->

    <div class="row mt-4" id="projectsContainer">

        <!-- JS LOADED PROJECTS HERE -->

    </div>

    <!-- =========================
        TEMPLATE
    ========================== -->

    <template id="projectCardTemplate">

        <div class="col-lg-4 col-md-6 mb-4">

            <div class="card project-card h-100">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h5 class="project-title fw-bold"></h5>

                        <span class="badge"></span>

                    </div>

                    <p><b>Client:</b> <span class="project-client"></span></p>

                    <p><b>Category:</b> <span class="project-category"></span></p>

                    <p><b>Location:</b> <span class="project-location"></span></p>

                    <hr>

                    <p><b>Employees:</b> <span class="employee-count">0</span></p>

                    <div class="small text-muted mb-2">

                        Current Procedure:
                        <b class="current-procedure">Waiting Assignment</b>

                    </div>

                    <div class="small text-muted mb-3">

                        Estimated Finish:
                        <b class="estimated-finish">--</b>

                    </div>

                    <div class="d-flex gap-2">

                        <button class="btn btn-outline-primary w-50 edit-project">
                            Edit
                        </button>

                        <button class="btn btn-outline-danger w-50 delete-project">
                            Delete
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </template>

</div>
